<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InfluenceX · Collaborations</title><link rel="stylesheet" href="/auth.css"></head>
<body><main><a class="logo" href="/">Influence<span>X</span></a><p class="eyebrow">YOUR NEXT COLLABORATION STARTS HERE</p><h1>Good work starts<br>with a connection.</h1><p>Sign in to set up your brand or creator profile.</p>
<section><form id="login"><h2>Welcome to InfluenceX</h2><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="8" required></label><div class="buttons"><button>Sign in</button><button type="button" id="signup" class="secondary">Create account</button></div></form>
<form id="profile" hidden><h2>Your profile</h2><label>Display name<input id="name" maxlength="120" required></label><label>I’m joining as<select id="role"><option value="brand">Brand</option><option value="influencer">Creator</option></select></label><button>Save profile</button></form>
<div id="account" hidden><h2 id="greeting"></h2><p id="details"></p><button id="logout" class="secondary">Sign out</button></div><p id="status" role="status" aria-live="polite"></p></section><div id="workspace" hidden>
<nav class="buttons" aria-label="Workspace"><button id="show-collaborations">Collaborations</button><button id="show-discovery" class="secondary">Discover creators</button></nav>
<section id="discovery" hidden><h2>Find your next collaborator</h2><form id="search-form" class="buttons"><input id="search" placeholder="Search creators by name" aria-label="Creator name"><button>Search</button></form><div id="creators" class="grid"></div></section>
<section id="booking-panel" hidden><h2 id="booking-title">New collaboration</h2><form id="booking">
<label>Collaboration title<input name="title" required maxlength="200"></label>
<label>Creative brief<textarea name="brief" required maxlength="10000"></textarea></label>
<div class="grid"><label>Total fee (₹)<input name="amount" type="number" min="0.01" step="0.01" required></label><label>Deadline<input name="deadline" type="date" required></label></div>
<label>Deliverables (one per line)<textarea name="deliverables" placeholder="One Instagram reel&#10;Three stories" required></textarea></label>
<label>Usage rights<textarea name="usage_rights" placeholder="Where and for how long may the brand use this content?" required maxlength="10000"></textarea></label>
<label>Included revision rounds<input name="revision_limit" type="number" min="0" max="10" value="1" required></label>
<div class="buttons"><button>Send proposal</button><button type="button" id="close-booking" class="secondary">Cancel</button></div></form></section>
<section id="collaborations"><div class="buttons"><h2>Your collaborations</h2><button id="refresh" class="secondary">Refresh</button></div><div id="collaboration-list" class="grid"></div></section>
<section id="collaboration-detail" hidden></section>
<p id="workspace-status" role="status" aria-live="polite"></p></div>
<small>Secure sign-in powered by Supabase</small></main><script type="module" src="/auth.js"></script></body></html>
