<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InfluenceX — Creator Marketplace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-gray-50">

<!-- Login Modal -->
<div id="loginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8 mx-4">
    <div class="text-center mb-6">
      <h1 class="text-3xl font-bold bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent">InfluenceX</h1>
      <p class="text-gray-500 mt-2">Creator Marketplace</p>
    </div>
    <div class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="loginEmail" placeholder="email@example.com" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="loginPassword" placeholder="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500">
      </div>
      <button onclick="window.auth.login()" class="w-full py-2 rounded-lg gradient-bg text-white font-semibold hover:opacity-90 transition">Login</button>
    </div>
    <div class="mt-6 text-center text-sm text-gray-500">
      <p class="font-medium mb-1">Demo Accounts:</p>
      <p class="text-xs">👑 Admin: admin@influencex.com / admin123</p>
      <p class="text-xs">💼 Brand: ravi@store.com / demo123</p>
      <p class="text-xs">🌟 Influencer: priya@demo.com / demo123</p>
    </div>
  </div>
</div>

<!-- Edit Rates Modal -->
<div id="editRatesModal" class="modal">
  <div class="modal-content p-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">Edit Your Rates</h2>
      <button onclick="window.influencer.closeEditRatesModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
    </div>
    <div class="space-y-4">
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Instagram Story (₹)</label><input type="number" id="editRateStory" class="w-full px-4 py-2 border border-gray-300 rounded-lg"></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Instagram Reel (₹)</label><input type="number" id="editRateReel" class="w-full px-4 py-2 border border-gray-300 rounded-lg"></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Feed Post (₹)</label><input type="number" id="editRatePost" class="w-full px-4 py-2 border border-gray-300 rounded-lg"></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">YouTube Integration (₹)</label><input type="number" id="editRateYoutube" class="w-full px-4 py-2 border border-gray-300 rounded-lg"></div>
      <button onclick="window.influencer.saveRates()" class="w-full py-2 rounded-lg gradient-bg text-white font-semibold hover:opacity-90 transition mt-4">Save Changes</button>
    </div>
  </div>
</div>

<!-- Create Campaign Modal -->
<div id="createCampaignModal" class="modal">
  <div class="modal-content p-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">Create New Campaign</h2>
      <button onclick="window.brand.closeCreateCampaignModal()" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
    </div>
    <div class="space-y-4">
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Campaign Name</label><input type="text" id="campaignName" class="w-full px-4 py-2 border border-gray-300 rounded-lg"></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Select Influencer</label><select id="campaignInfluencer" class="w-full px-4 py-2 border border-gray-300 rounded-lg"></select></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Content Type</label><select id="campaignType" class="w-full px-4 py-2 border border-gray-300 rounded-lg"><option>Instagram Reel</option><option>Instagram Story</option><option>Feed Post</option><option>YouTube Video</option></select></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Budget (₹)</label><input type="number" id="campaignAmount" class="w-full px-4 py-2 border border-gray-300 rounded-lg"></div>
      <div><label class="block text-sm font-medium text-gray-700 mb-1">Deadline</label><input type="date" id="campaignDeadline" class="w-full px-4 py-2 border border-gray-300 rounded-lg"></div>
      <button onclick="window.brand.createCampaign()" class="w-full py-2 rounded-lg gradient-bg text-white font-semibold hover:opacity-90 transition">Create Campaign</button>
    </div>
  </div>
</div>

<!-- Confirm Modal -->
<div id="confirmModal" class="confirm-modal">
  <div class="confirm-modal-content">
    <div class="confirm-modal-header"><span id="confirmIcon" style="font-size: 24px;">⚠️</span><h3 id="confirmTitle" class="font-bold text-lg">Confirm Action</h3></div>
    <div id="confirmMessage" class="confirm-modal-body">Are you sure?</div>
    <div class="confirm-modal-footer">
      <button class="confirm-btn confirm-btn-cancel" onclick="window.ui.hideConfirmModal()">Cancel</button>
      <button id="confirmActionBtn" class="confirm-btn confirm-btn-confirm" onclick="window.ui.executeConfirm()">Confirm</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"><span class="toast-icon" id="toastIcon">✓</span><span class="toast-message" id="toastMessage">Success!</span></div>

<!-- Main App -->
<div id="app" style="display: none;">
  <nav class="bg-white border-b border-gray-200 fixed w-full z-30 top-0 shadow-sm">
    <div class="px-6 py-3 flex justify-between items-center">
      <div class="flex items-center gap-8">
        <h1 id="mainLogo" class="text-xl font-bold bg-gradient-to-r from-purple-600 to-indigo-600 bg-clip-text text-transparent">InfluenceX</h1>
        <div id="modeSwitcher" class="flex gap-2 bg-gray-100 rounded-lg p-1">
          <button onclick="window.app.switchMode('brand')" id="brandModeBtn" class="px-4 py-1.5 rounded-md text-sm font-medium">💼 Business</button>
          <button onclick="window.app.switchMode('influencer')" id="infModeBtn" class="px-4 py-1.5 rounded-md text-sm font-medium">🌟 Influencer</button>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="window.app.toggleNotifications()" class="relative p-2">🔔<span id="notifBadge" class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full hidden"></span></button>
        <div id="userAvatar" class="w-8 h-8 rounded-full gradient-bg flex items-center justify-center text-white text-sm font-bold"></div>
        <span id="userName" class="text-sm font-medium"></span>
        <button onclick="window.auth.logout()" class="text-sm text-gray-500 hover:text-gray-700">Logout</button>
      </div>
    </div>
  </nav>
  <div id="adminModeIndicator" class="fixed top-20 right-4 z-40 hidden"><div class="bg-red-500 text-white px-3 py-1 rounded-full text-xs font-bold shadow-lg">👑 Admin Mode</div></div>
  <div class="flex pt-16">
    <aside id="sidebar" class="w-64 bg-white border-r border-gray-200 min-h-screen fixed left-0 top-16 bottom-0 overflow-y-auto"></aside>
    <main id="mainContent" class="ml-64 flex-1 p-6"></main>
  </div>
</div>

<!-- Script Modules -->
<script src="/js/config.js"></script>
<script src="/js/utils.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/admin.js"></script>
<script src="/js/brand.js"></script>
<script src="/js/influencer.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
